<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#f5f5f5;
            font-family:Arial,sans-serif;
        }

        button{
            padding:12px 30px;
            font-size:16px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            background:#ff9315;
            color:white;
        }

        button:hover{
            background:#e67f00;
        }
    </style>
</head>
<body>

    <button id="logoutBtn">Logout</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";

	    const firebaseConfig = {
	      apiKey: "AIzaSyBpLcSFmn1gNTklHu2eiebDYtXpq0qIhlM",
	      authDomain: "adey-bonda.firebaseapp.com",
	      projectId: "adey-bonda",
	      storageBucket: "adey-bonda.firebasestorage.app",
	      messagingSenderId: "820555835547",
	      appId: "1:820555835547:web:efc14ad017ab4d206f7e3e"
	    };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById("logoutBtn").addEventListener("click", () => {
            signOut(auth)
            .then(() => {
                localStorage.setItem("IsInformationEntered", "false");
                window.location.href = "index.html";
            })
            .catch((error) => {
                alert(error.message);
            });
        });
    </script>

</body>
</html>
